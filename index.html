<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Re Perdido! - El Juego</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flag-icon-css/3.5.0/css/flag-icon.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        /* ===== BASE STYLES ===== */
        :root {
            --primary: #1A1A2E;
            --secondary: #16213E;
            --accent: #E94560;
            --text: #FFFFFF;
            --success: #00B894;
            --warning: #FDCB6E;
            --danger: #D63031;
        }

        body {
            font-family: 'Nunito', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--primary);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: var(--secondary);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo {
            max-width: 150px;
            margin-bottom: 1rem;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* ===== PLAYER MANAGEMENT ===== */
        .player-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 1.5rem;
            margin: 1.5rem 0;
        }

        #playerList {
            min-height: 120px;
            margin: 1rem 0;
        }

        .player-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            margin: 0.5rem 0;
            background: var(--accent);
            border-radius: 10px;
            cursor: move;
            transition: all 0.3s ease;
        }

        .player-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .remove-btn {
            background: var(--danger);
            border: none;
            color: white;
            padding: 0.25rem 0.5rem;
            border-radius: 50%;
            cursor: pointer;
            margin-left: 0.5rem;
            font-size: 0.8em;
        }

        /* ===== GAME CONTROLS ===== */
        .controls {
            display: grid;
            gap: 0.75rem;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            margin: 1.5rem 0;
        }

        button {
            background: var(--accent);
            border: none;
            color: var(--text);
            padding: 0.75rem;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        /* ===== GAME DISPLAY ===== */
        #turnDisplay {
            text-align: center;
            font-size: 1.25rem;
            margin: 1.5rem 0;
            min-height: 40px;
        }

        #wordDisplay {
            font-size: 1.75rem;
            text-align: center;
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            margin: 1.5rem 0;
            transition: all 0.5s ease;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .impostor {
            color: var(--warning);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* ===== MODALS ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--secondary);
            padding: 2rem;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
            position: relative;
        }

        /* ===== MOBILE OPTIMIZATION ===== */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            
            .container {
                padding: 1rem;
            }
            
            button {
                font-size: 0.9rem;
                padding: 0.6rem;
            }
            
            #wordDisplay {
                font-size: 1.5rem;
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <img src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExc3o1MDRoM2h3dWV6b3ZxYTlobGxibng4czAxMHR0NnYzZzZnMXVwNCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/FepRQChUMDpYt0lHlE/giphy.gif" alt="Logo" class="logo">
            <button onclick="showTutorial()">?</button>
        </header>

        <div class="player-section">
            <div class="controls">
                <select id="gameMode">
                    <option value="re_perdido">Re Perdido</option>
                    <option value="requete_perdido">Requete Perdido</option>
                </select>
                <select id="category">
                    <option value="deportes">Deportes</option>
                    <option value="alimentos">Alimentos</option>
                    <option value="peliculas">Películas</option>
                    <option value="series">Series</option>
                    <option value="anime">Anime</option>
                    <option value="videojuegos">Videojuegos</option>
                    <option value="superheroes">Superhéroes</option>
                    <option value="paises">Países</option>
                    <option value="ciudades">Ciudades</option>
                    <option value="franquicias">Franquicias</option>
                    <option value="objetos">Objetos Cotidianos</option>
                    <option value="random">Aleatorio</option>
                </select>
            </div>

            <div class="controls">
                <input type="text" id="playerName" placeholder="Nombre del jugador">
                <button onclick="addPlayer()">Añadir Jugador</button>
            </div>

            <div id="playerList"></div>
        </div>

        <div class="controls">
            <button onclick="startGame()" id="startBtn">Comenzar Juego</button>
            <button onclick="showWord()" id="showWordBtn" disabled>Mostrar Palabra</button>
            <button onclick="nextTurn()" id="nextTurnBtn" disabled>Siguiente Turno</button>
            <button onclick="endGame()" id="endGameBtn" disabled>Finalizar Juego</button>
            <button onclick="resetGame()" class="danger">Reiniciar</button>
        </div>

        <div id="turnDisplay"></div>
        <div id="wordDisplay"></div>
    </div>

    <script>
        // ===== GAME STATE =====
        let players = [];
        let currentTurn = 0;
        let impostorIndex = -1;
        let mainWord = '';
        let altWord = '';
        let gameStarted = false;
        
        // ===== CATEGORIES =====
        const categories = {
            deportes: [],
            alimentos: [],
            peliculas: [],
            series: [],
            anime: [],
            videojuegos: [],
            superheroes: [],
            paises: [],
            ciudades: [],
            franquicias: [],
            objetos: []
        };

        // ===== DATA LOADING =====
       async function loadCategoryData(category) {
    console.log(`Loading category: ${category}`); // Debugging
    try {
        const response = await fetch(`data/${category}.json`);
        if (!response.ok) {
            throw new Error(`HTTP error! Status: ${response.status}`);
        }
        const data = await response.json();
        console.log(`Data loaded for ${category}:`, data); // Debugging
        return data;
    } catch (error) {
        console.error(`Error loading ${category}:`, error);
        return [];
    }
}

        // ===== PLAYER MANAGEMENT =====
        function addPlayer() {
            const nameInput = document.getElementById('playerName');
            const name = nameInput.value.trim();
            
            if (name && !players.includes(name)) {
                players.push(name);
                nameInput.value = '';
                updatePlayerList();
            }
        }

        function updatePlayerList() {
            const playerList = document.getElementById('playerList');
            playerList.innerHTML = players.map((player, index) => `
                <div class="player-item" data-index="${index}">
                    ${player}
                    <button class="remove-btn" onclick="removePlayer(${index})">×</button>
                </div>
            `).join('');
            
            Sortable.create(playerList, {
                animation: 150,
                onUpdate: (evt) => {
                    const movedPlayer = players.splice(evt.oldIndex, 1)[0];
                    players.splice(evt.newIndex, 0, movedPlayer);
                    updatePlayerList();
                }
            });
        }

        function removePlayer(index) {
            players.splice(index, 1);
            updatePlayerList();
        }

        // ===== GAME LOGIC =====
        async function startGame() {
            if (players.length < 2) {
                Swal.fire('Error', '¡Se necesitan al menos 2 jugadores!', 'error');
                return;
            }

            const category = document.getElementById('category').value;
            const words = await loadCategoryData(category);
            
            if (words.length < 2) {
                Swal.fire('Error', 'No hay suficientes palabras en esta categoría', 'error');
                return;
            }

            Swal.fire({
                title: '¡Comenzamos!',
                html: `Modo: ${document.getElementById('gameMode').value.toUpperCase()}<br>
                       Jugadores: ${players.length}<br>
                       Categoría: ${category}`,
                confirmButtonText: '¡Empezar!'
            }).then(() => {
                gameStarted = true;
                impostorIndex = Math.floor(Math.random() * players.length);
                
                // Ensure mainWord and altWord are different
                mainWord = words[Math.floor(Math.random() * words.length)];
                do {
                    altWord = words[Math.floor(Math.random() * words.length)];
                } while (altWord === mainWord);
                
                document.getElementById('startBtn').disabled = true;
                document.getElementById('showWordBtn').disabled = false;
                updateTurnDisplay();
            });
        }

        function showWord() {
            const currentPlayer = players[currentTurn];
            let word = mainWord;
            
            if (currentTurn === impostorIndex) {
                if (document.getElementById('gameMode').value === 're_perdido') {
                    word = '¡Estás re perdido!';
                } else {
                    word = altWord;
                }
            }

            const wordDisplay = document.getElementById('wordDisplay');
            wordDisplay.style.opacity = 0;
            wordDisplay.style.transform = 'scale(0.8)';
            
            setTimeout(() => {
                wordDisplay.innerHTML = currentTurn === impostorIndex && 
                    document.getElementById('gameMode').value === 're_perdido' 
                    ? `<span class="impostor">${word}</span>`
                    : word;
                
                wordDisplay.style.opacity = 1;
                wordDisplay.style.transform = 'scale(1)';
                document.getElementById('showWordBtn').disabled = true;
                document.getElementById('nextTurnBtn').disabled = false;
            }, 300);
        }

        function nextTurn() {
            currentTurn++;
            if (currentTurn >= players.length) {
                startQuestionRound();
                return;
            }
            
            updateTurnDisplay();
            document.getElementById('showWordBtn').disabled = false;
            document.getElementById('nextTurnBtn').disabled = true;
        }

        function startQuestionRound() {
            Swal.fire({
                title: '¡Ronda de Preguntas!',
                html: 'Discutan y descubran al impostor',
                timer: 30000,
                timerProgressBar: true
            }).then(() => {
                endGame();
            });
        }

        function endGame() {
            Swal.fire({
                title: '¡Juego Terminado!',
                html: `La palabra era: <strong>${mainWord}</strong><br>
                       El impostor era: <strong>${players[impostorIndex]}</strong>`,
                confirmButtonText: 'OK'
            });
            resetGameState();
        }

        function resetGame() {
            if (confirm('¿Estás seguro de querer reiniciar?')) {
                players = [];
                resetGameState();
                updatePlayerList();
            }
        }

        function resetGameState() {
            gameStarted = false;
            currentTurn = 0;
            impostorIndex = -1;
            document.getElementById('startBtn').disabled = false;
            document.getElementById('showWordBtn').disabled = true;
            document.getElementById('nextTurnBtn').disabled = true;
            document.getElementById('endGameBtn').disabled = true;
            document.getElementById('turnDisplay').textContent = '';
            document.getElementById('wordDisplay').textContent = '';
        }

        // ===== UTILITIES =====
        function updateTurnDisplay() {
            document.getElementById('turnDisplay').textContent = 
                `Turno de: ${players[currentTurn]}`;
        }

        function showTutorial() {
            Swal.fire({
                title: '¿Cómo Jugar?',
                html: `<ol>
                    <li>Añade al menos 2 jugadores</li>
                    <li>Selecciona modo de juego y categoría</li>
                    <li>Presiona "Comenzar Juego"</li>
                    <li>Cada jugador verá su palabra cuando sea su turno</li>
                    <li>¡El impostor debe engañar a los demás!</li>
                    <li>Después de todos los turnos, discutan quién creen que es el impostor</li>
                </ol>`,
                confirmButtonText: 'Entendido'
            });
        }

        // Initialize game
        document.addEventListener('DOMContentLoaded', updatePlayerList);
    </script>
</body>
</html>
